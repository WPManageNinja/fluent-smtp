<?xml version="1.0" encoding="utf-8"?>
<!--
  Webhook mark, from Tabler Icons (https://github.com/tabler/tabler-icons),
  MIT licensed, Copyright (c) 2020-2024 Paweł Kuna. Paths unchanged; only the
  stroke colours are set here.

  Tabler ships it as currentColor, which is no use in the admin because the
  channel list renders the logo in an <img>, where nothing is inherited. The
  three arcs are given three related hues so the mark reads as a colour logo
  beside the four brand marks rather than as a grey glyph, and so it is not yet
  another blue. Checked at 24px (channel row) and 28px (form header), the sizes
  _layout.scss sets, on both the light and dark admin colour schemes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96"
     fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <path stroke="#0ea5e9" d="M4.876 13.61a4 4 0 1 0 6.124 3.39h6"/>
  <path stroke="#14b8a6" d="M15.066 20.502a4 4 0 1 0 1.934 -7.502c-.706 0 -1.424 .179 -2 .5l-3 -5.5"/>
  <path stroke="#f59e0b" d="M16 8a4 4 0 1 0 -8 0c0 1.506 .77 2.818 2 3.5l-3 5.5"/>
</svg>
